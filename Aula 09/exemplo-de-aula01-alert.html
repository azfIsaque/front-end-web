<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript no head e no body</title>

    <script>alert("Eu estou no cabeçalho");</script>
    <style>
        .destaque{
            color: palevioletred;
            font-size: 30px;
            font-weight: bold;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>JavaScript incorporado</h1>
    <p>Este conteudo foi escrito com html</p>
    <script>document.write("<p class = 'destaque'> Este conteudo foi criado pelo JavaScript</p>");</script>
</body>
</html>
