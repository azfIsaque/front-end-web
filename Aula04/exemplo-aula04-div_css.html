<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo div, br e hr</title>
    
    <style>
        div{
            font-size:30px ;
            text-align: center;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
        }
        #principal{

            background-color: wheat;
            border: 2px solid black;
        }
        #secundaria{

            background-color: aquamarine;
            border: 2px solid cadetblue
        }
        hr{
            border: none;
            border-top: 3px solid purple;
            width: 97%;

        }

    </style>

</head>
<body>
    <div id = "principal">

        esta é a primeira linha.
        <br>
        esta é a segunda linha

    </div>
    <hr>
    <div id = "secundaria">

        esta é a outra divisão da página
        <br>
        aqui começa uma nova linha

    </div>

</body>
</html>
